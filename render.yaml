services:
  - type: web
    name: hinglish-stt
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Secrets: set these in the Render dashboard (sync: false) ---------
      - key: GEMINI_API_KEY
        sync: false
      # Pooled endpoint: application query traffic.
      - key: DATABASE_URL
        sync: false
      # Direct endpoint: schema DDL/migrations (PgBouncer cannot run them).
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Set to https://<service-name>.onrender.com once the URL is known.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Non-secret defaults ---------------------------------------------
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-live-preview,gemini-3.8-live
      - key: GEMINI_API_VERSION
        value: v1beta
      - key: ENVIRONMENT
        value: production
      - key: MAX_SESSION_SECONDS
        value: "900"
      - key: MAX_CONCURRENT_SESSIONS
        value: "4"
      - key: MAX_TRANSCRIPT_CHARS
        value: "50000"
